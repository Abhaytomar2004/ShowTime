apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

apiVersion: v1
kind: Service
metadata:
  name: showtime-service
spec:
  type: NodePort
  selector:
    app: showtime-app
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30001